\* CURRENT CODE (#431 residual fix) : every OperatorDataPushed / PreKickoff
\* graph is a scan entry, so each graph's kickoff is checked directly.
\* ScanDepth = 0 deliberately disables the chain walk in the model: coverage
\* must hold without any walk, so the real 32-step cap cannot matter.
\* Expected to PASS for every choice of the kicked graph.
CONSTANTS NumGraphs = 4  ScanDepth = 0  ScanAllPending = TRUE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT KickoffAlwaysCovered
