name: Time-consuming test

on:
  push:
    branches: ["main", "dev"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Cargo Test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - run: |
          set -e
          export PATH=$HOME/.cargo/bin:$PATH
          cargo test -r --all --features ci-tests -- --nocapture
