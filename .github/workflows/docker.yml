name: Build and Push Docker Image

on:
  push:
    branches: [ main, dev ]  # or your deployment branch
  workflow_dispatch:    # allow manual trigger

env:
  IMAGE_REPO: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write  # needed for GitHub Container Registry

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        timeout-minutes: 30
        with:
          toolchain: nightly
          override: true

      - name: Extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -n1 | sed -E 's/version = "(.*)"/\1/')
          echo "CARGO_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Using version: $VERSION"

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt install protobuf-compiler -y

      - name: Build all binaries
        run: cargo build -r --workspace

      - name: Collect and stage binaries
        run: |
          mkdir -p release-binaries
          BINS=(
            "target/release/noded"
            "target/release/sequencer-set-publish"
            "target/release/send-challenge"
            "target/release/send-rbf"
            "target/release/send-pegin-request"
            "target/release/send-pegout"
            "target/release/db-inject"
          )
          for bin in "${BINS[@]}"; do
            if [ -f "$bin" ]; then
              cp "$bin" release-binaries/
              echo "✓ $(basename $bin)"
            fi
          done
          ls -lh release-binaries/

      - name: Upload binaries as release artifacts
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-binaries/*
          token: ${{ secrets.GITHUB_TOKEN }} 

      - name: Set lowercase repo name
        id: lowercase
        run: echo "REPO_LOWER=$(echo '${{ env.IMAGE_REPO }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./node/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}-node:latest
            ghcr.io/${{ env.REPO_LOWER }}-node:${{ env.CARGO_VERSION }}
